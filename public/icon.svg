  <circle cx="250" cy="250" r="240" fill="#E60000" />
  
  <!-- Stylized VA Modern Monogram -->
  <!-- Left Wing of 'V' swooping down and sweeping up -->
  <path d="M 98 135 C 135 190 150 250 170 295 C 190 330 225 330 260 250 C 275 215 285 160 288 130 C 280 160 260 230 220 280 C 185 315 150 295 130 240 C 118 200 108 160 98 135 Z" fill="#FFFFFF" />
  
  <!-- Right Arch of 'A' -->
  <path d="M 235 305 C 248 245 285 140 375 135 C 415 175 435 240 445 305 C 428 240 395 175 350 165 C 305 160 265 245 235 305 Z" fill="#FFFFFF" />
  
  <!-- Center Circular Dot inside 'A' -->
  <circle cx="340" cy="230" r="23" fill="#FFFFFF" />
  
  <!-- Brand Typography -->
  <g fill="#FFFFFF" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- VASTHUSILPY -->
    <text x="250" y="360" font-size="44" font-weight="300" letter-spacing="3">VASTHUSILPY</text>
    
    <!-- KERALASSERY -->
    <text x="250" y="405" font-size="33" font-weight="400" letter-spacing="4">KERALASSERY</text>
